name: Tests

on:
  push:
    paths: ["pricing_tracker/**", "tests/**", "sql/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r pricing_tracker/requirements.txt pytest==8.4.2
      - run: python -m pytest -q tests
